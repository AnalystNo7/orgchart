services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orgchart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orgchart}
      POSTGRES_DB: orgchart
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      DATABASE_URL: "postgresql://orgchart:${DB_PASSWORD:-orgchart}@db:5432/orgchart"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-change-me-in-production}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      AI_PROVIDER: "${AI_PROVIDER:-anthropic}"
      AI_MODEL: "${AI_MODEL:-claude-sonnet-4-20250514}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
    depends_on:
      - db
    networks:
      - dokploy-network

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
