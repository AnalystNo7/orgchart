services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orgchart
      POSTGRES_PASSWORD: orgchart
      POSTGRES_DB: orgchart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://orgchart:orgchart@db:5432/orgchart"
      NEXTAUTH_SECRET: "change-me-in-production-use-openssl-rand-base64-32"
      NEXTAUTH_URL: "http://localhost:3000"
      AI_PROVIDER: "${AI_PROVIDER:-anthropic}"
      AI_MODEL: "${AI_MODEL:-claude-sonnet-4-20250514}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
    depends_on:
      - db

volumes:
  pgdata:
