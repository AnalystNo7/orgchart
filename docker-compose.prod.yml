services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orgchart
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orgchart}
      POSTGRES_DB: orgchart
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://orgchart:${DB_PASSWORD:-orgchart}@db:5432/orgchart"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      AI_PROVIDER: "${AI_PROVIDER:-anthropic}"
      AI_MODEL: "${AI_MODEL:-claude-sonnet-4-20250514}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
      VOYAGE_API_KEY: "${VOYAGE_API_KEY:-}"
    depends_on:
      - db
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orgchart.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.orgchart.entrypoints=websecure"
      - "traefik.http.routers.orgchart.tls.certresolver=letsencrypt"
      - "traefik.http.services.orgchart.loadbalancer.server.port=3000"

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
